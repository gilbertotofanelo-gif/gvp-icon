  <script>
    const urlGVP = "https://script.google.com/macros/s/AKfycbwuLAkahBekBJ_TTDYs4Yr7ZcdcsFGICnRoA1jVAfwXrywGDdLjulS0U4CT15h_ifSd/exec";
    
    // 🔥 CAPTURA O TOKEN DA URL (?d=...)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('d');
    
    // Monta a URL final do GAS (com o token, se existir)
    let urlFinal = urlGVP;
    if (token) {
        urlFinal += "?d=" + encodeURIComponent(token);
    }

    // iPhone/iPad: identifica quando a página foi aberta pelo ícone da Tela de Início.
    if (window.navigator.standalone === true) {
        window.location.href = urlFinal;
    }

    // Android / Chrome: identifica quando a página foi aberta em modo standalone.
    window.addEventListener('DOMContentLoaded', function () {
        const standalone = window.matchMedia('(display-mode: standalone)').matches;
        if (standalone) {
            window.location.href = urlFinal;
        }
    });
  </script>
