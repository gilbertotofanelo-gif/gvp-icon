<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>GVP</title>

  <!-- Manifest para Android -->
  <link
    rel="manifest"
    href="manifest.json">

  <!-- Ícone para iPhone/iPad -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://raw.githubusercontent.com/gilbertotofanelo-gif/gvp-icon/main/GVP-Icon-180.png">

  <!-- Ícone para navegadores -->
  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/gilbertotofanelo-gif/gvp-icon/main/GVP-Icon-180.png">

  <!-- Configuração do aplicativo no iOS -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

  <meta
    name="apple-mobile-web-app-title"
    content="GVP">

  <meta
    name="theme-color"
    content="#0078D7">

  <style>

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
    }

    img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-top: 20px;
    }

    h1 {
      margin-top: 15px;
      margin-bottom: 20px;
      color: #0078D7;
      font-size: 30px;
    }

    .instrucao {
      margin: 25px auto 0;
      max-width: 360px;
      padding: 18px;
      border-radius: 12px;
      background: #f2f2f2;
      color: #333333;
      font-size: 19px;
      line-height: 1.5;
      font-weight: bold;
    }

    .observacao {
      margin: 18px auto 0;
      max-width: 360px;
      color: #666666;
      font-size: 16px;
      line-height: 1.4;
    }

  </style>

  <script>

    const urlGVP =
      "https://script.google.com/macros/s/AKfycbyt6a6FJ7ITAyGwkT0B41hru_fqFNLbwnMzKMy7opDM7QKkj3UI1qrzAdWBIoBrnI27/exec";

    /*
      iPhone/iPad:
      identifica quando a página foi aberta
      pelo ícone da Tela de Início.
    */
    if (window.navigator.standalone === true) {

      window.location.href = urlGVP;

    }

    /*
      Android / Chrome:
      identifica quando a página foi aberta
      em modo standalone através do manifest.
    */
    window.addEventListener('DOMContentLoaded', function () {

      const standalone =
        window.matchMedia('(display-mode: standalone)').matches;

      if (standalone) {

        window.location.href = urlGVP;

      }

    });

  </script>

</head>

<body>

  <img
    src="https://raw.githubusercontent.com/gilbertotofanelo-gif/gvp-icon/main/GVP-Icon-180.png"
    alt="Ícone GVP">

  <h1>GVP</h1>

  <div class="instrucao">
    Execute "Adicionar à Tela de Início".
  </div>

  <div class="observacao">
    Depois, toque no ícone GVP que será criado
    na Tela de Início para acessar o sistema.
  </div>

</body>
</html>
