<script>
const urlGVP = "https://script.google.com/macros/s/AKfycbx6wW5b5yKpzJSJEw04q-7Cx9uct8fvlHR4ifgEZVYPhT3AQuDjXwHrZ9fT47YzMRiT/exec";

const urlParams = new URLSearchParams(window.location.search);

function tokenValido(token) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
        .test(String(token || '').trim());
}

function gerarToken() {
    if (window.crypto && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function obterToken() {
    let token = urlParams.get('d');
    if (tokenValido(token)) {
        token = token.toLowerCase();
    } else {
        token = null;
    }
    if (!token) {
        try {
            const salvo = localStorage.getItem('gvp_device');
            if (tokenValido(salvo)) token = salvo.toLowerCase();
        } catch (e) {}
    }
    if (!token) token = gerarToken();
    try { localStorage.setItem('gvp_device', token); } catch (e) {}
    return token;
}

const token = obterToken();
const urlFinal = urlGVP + "?d=" + encodeURIComponent(token);

function ehStandalone() {
    return window.navigator.standalone === true
        || window.matchMedia('(display-mode: standalone)').matches;
}

function ehMobile() {
    return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}

function ehDesktop() {
    return /Windows|Macintosh|Mac OS X|Linux/i.test(navigator.userAgent) && !ehMobile();
}

function ajustarInterface() {
    const btn = document.getElementById('btnAcessar');

    // 1) PWA instalado (celular): redireciona direto para o Apps Script
    if (ehStandalone()) {
        window.location.replace(urlFinal);
        return;
    }

    // 2) Desktop (Windows/Mac/Linux): mostra o botão e esconde instruções de celular
    if (ehDesktop()) {
        if (btn) {
            btn.href = urlFinal;          // dá destino ao botão
            btn.style.display = 'block';  // tira o display:none
        }
        const instr = document.querySelector('.instrucao');
        const obs   = document.querySelector('.observacao');
        if (instr) instr.style.display = 'none';
        if (obs)   obs.style.display   = 'none';
        return;
    }

    // 3) Celular NÃO instalado: mostra instrução de "Adicionar à Tela de Início"
    //    (esconde o botão de desktop — já está oculto por padrão no CSS)
}

document.addEventListener('DOMContentLoaded', ajustarInterface);
</script>
